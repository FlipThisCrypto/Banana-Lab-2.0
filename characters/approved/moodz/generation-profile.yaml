compositor_settings:
  # Values used for the ISSUE001-P16-02 candidate (exp005).
  # NOTE the provenance split. Three of these are recorded in the repository.
  # Three were supplied to the author of this file and could not be found in
  # any repository file. They are marked and must be confirmed before reuse.
  code: app/services/compositor.py
  plate_calibration:
    provenance: verified
    source: workflows/comfyui/experiments/exp003-weighted-style/exp003_seed760201.calibration.yaml
    horizon_y: 430.0
    calib_foot_y: 1000.0
    calib_height_px: 460.0
    calib_height_in_characters: 1.0
    ground_surface: metal floor grating, hard reflective
    caveat: >-
      The calibration file states plainly that these are art-directed estimates
      read off the plate by eye, checked against a scale-ladder preview, and are
      not camera calibration.

  light_and_scale:
    key_strength:
      value: 0.22
      provenance: verified
      source: docs/audits/PANEL_PRODUCTION_LOOP_REPORT.md EXP-005 ("key strength 0.50 -> 0.22")
      note: compositor default is 0.55
    fill_strength:
      value: 0.10
      provenance: verified
      source: docs/audits/PANEL_PRODUCTION_LOOP_REPORT.md EXP-005 ("fill 0.20 -> 0.10")
      note: compositor default is 0.18
    scale_multiplier:
      value: 0.78
      provenance: verified
      source: workflows/comfyui/experiments/exp005-composite-v2/exp005_report.json
    rim_strength:
      value: 0.10
      provenance: unverified
      note: >-
        NOT FOUND in any repository file. The compositor's LightContract default
        for rim_strength is 0.0 and no experiment record sets it. Confirm before
        relying on this value.
    contact_opacity:
      value: 0.85
      provenance: unverified
      note: >-
        NOT FOUND in any repository file. Compositor default is 0.72.
    cast_opacity:
      value: 0.50
      provenance: unverified
      note: >-
        NOT FOUND in any repository file. Compositor default is 0.42.
    key_colour:
      provenance: verified
      source: docs/audits/PANEL_PRODUCTION_LOOP_REPORT.md EXP-005
      note: >-
        Matched to the plate's actual cyan light, not the panel script's ideal
        red. The calibration file records key_color [200, 80, 58] (red) and
        fill_color [30, 74, 85]; the report states the key colour was changed
        for exp005. The exact substituted RGB triple is not recorded anywhere.

  placement_used:
    provenance: verified
    source: workflows/comfyui/experiments/exp005-composite-v2/exp005_report.json
    layer: moodz_00_clean_base.png
    centre_x: 660
    foot_y: 820
    depth_plane: midground
    scale_multiplier: 0.78
    rendered_px: [195, 245]
    top_left: [563, 575]
    flip: refused by the compositor

  guards_that_apply_to_this_character:
    no_flip:
      provenance: verified
      source: app/services/compositor.py NO_FLIP
      entry: 'MZ-CHAR-001: "black fringe over one eye, blue accent on the left"'
      behaviour: >-
        The compositor refuses the flip and emits a CANON warning. It does not
        silently mirror.
      fired_in_exp005: true
      warning_text: >-
        "CANON: refused to mirror MZ-CHAR-001 - black fringe over one eye, blue
        accent on the left"
    non_standing_poses:
      provenance: verified
      source: app/services/compositor.py NON_STANDING_POSES
      applies_to_layers_by_slug: [running, jumping, crouching, defeated]
      behaviour: >-
        Warns when the pose slug is in the set and contact_offset is 0.0.
        It warns; it does not refuse.
      known_false_positive: >-
        moodz_25_crouching.png is not crouched - it is standing. The slug-based
        guard will demand a contact_offset that this layer does not need. See
        known-failures.md KF-MZ-05.

